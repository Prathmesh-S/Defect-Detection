---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-jobmanager
  namespace: group-4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink
      role: jobmanager
  template:
    metadata:
      labels:
        app: flink
        role: jobmanager
    spec:
      containers:
        - name: jobmanager
          image: apache/flink:1.20.1-scala_2.12
          ports:
            - containerPort: 6123
            - containerPort: 8081
          env:
            - name: JOB_MANAGER_RPC_ADDRESS
              value: "flink-jobmanager"  # Updated: Use service name
            - name: FLINK_PROPERTIES
              value: |
                jobmanager.rpc.address: flink-jobmanager  # Updated: Use service name
                jobmanager.rpc.port: 6123
                rest.address: flink-jobmanager  # Updated: Use service name
                rest.bind-address: 0.0.0.0
                rest.port: 8081
                taskmanager.numberOfTaskSlots: 4
                parallelism.default: 1
          args:
            - jobmanager
          livenessProbe:
            httpGet:
              path: /taskmanagers
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager
  namespace: group-4
spec:
  selector:
    app: flink
    role: jobmanager
  ports:
    - name: rpc
      port: 6123
      targetPort: 6123
    - name: rest
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-taskmanager
  namespace: group-4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink
      role: taskmanager
  template:
    metadata:
      labels:
        app: flink
        role: taskmanager
    spec:
      containers:
        - name: taskmanager
          image: apache/flink:1.20.1-scala_2.12
          ports:
            - containerPort: 6121
          env:
            - name: JOB_MANAGER_RPC_ADDRESS
              value: "flink-jobmanager"  # Updated: Use service name
            - name: FLINK_PROPERTIES
              value: |
                jobmanager.rpc.address: flink-jobmanager  # Updated: Use service name
                jobmanager.rpc.port: 6123
                rest.address: flink-jobmanager  # Updated: Use service name
                rest.bind-address: 0.0.0.0
                rest.port: 8081
                taskmanager.numberOfTaskSlots: 4
                parallelism.default: 1
          args:
            - taskmanager
          livenessProbe:
            tcpSocket:
              port: 6121
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 10
---
apiVersion: batch/v1
kind: Job
metadata:
  name: debs-acm-flink-solution-job
  namespace: group-4
spec:
  backoffLimit: 10
  template:
    spec:
      containers:
        - name: debs-acm-flink-solution-container
          image: omariani24/debs-acm-flink-work:latest
          env:
            - name: API_TOKEN
