apiVersion: v1
kind: Namespace
metadata:
  name: group-4
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-jobmanager
  namespace: group-4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink
      component: jobmanager
  template:
    metadata:
      labels:
        app: flink
        component: jobmanager
    spec:
      containers:
        - name: jobmanager
          image: omariani24/debs-acm-flink-work:latest
          ports:
            - containerPort: 6123  # RPC port
            - containerPort: 8081  # Web UI
          args: ["standalone-job", "--job-classname", "solution.ClientRef", "--job-args", "http://challenge2025.debs.org:52923"]
          env:
            - name: FLINK_PROPERTIES
              value: |
                jobmanager.rpc.address: flink-jobmanager
                rest.port: 8081
                rest.address: 0.0.0.0
                jobmanager.bind-host: 0.0.0.0
                rest.bind-address: 0.0.0.0
          readinessProbe:
            tcpSocket:
              port: 6123
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6123
            initialDelaySeconds: 30
            periodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager
  namespace: group-4
spec:
  type: NodePort  # For external access
  ports:
    - name: rpc
      port: 6123
      targetPort: 6123
    - name: ui
      port: 8081
      targetPort: 8081
      nodePort: 30081  # Expose UI port
  selector:
    app: flink
    component: jobmanager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-taskmanager
  namespace: group-4
spec:
  replicas: 2  # Increased for parallelism
  selector:
    matchLabels:
      app: flink
      component: taskmanager
  template:
    metadata:
      labels:
        app: flink
        component: taskmanager
    spec:
      containers:
        - name: taskmanager
          image: flink:1.20.1-scala_2.12  # Same custom image
          args: ["taskmanager"]
          env:
            - name: FLINK_PROPERTIES
              value: |
                jobmanager.rpc.address: flink-jobmanager
                taskmanager.numberOfTaskSlots: 4
                taskmanager.memory.process.size: 1728m
